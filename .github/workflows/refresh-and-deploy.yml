name: Weekly refresh & deploy

# Runs once a week, after Friday's US market close (Saturday 10:00 UTC),
# refreshes all US-listed common stocks from Yahoo Finance, and publishes the
# browser-only screener to GitHub Pages. Can also be started by hand.
on:
  schedule:
    - cron: "0 10 * * 6"
  workflow_dispatch:
    inputs:
      limit:
        description: "Only fetch the first N tickers (blank = full universe)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      # Last week's database: keeps the previous good data for any ticker
      # that fails to fetch this week (e.g. Yahoo rate limits).
      - name: Restore previous database
        uses: actions/cache/restore@v6
        with:
          path: backend/data/screener.db
          key: screener-db-${{ github.run_id }}
          restore-keys: screener-db-

      - name: Refresh data from Yahoo Finance
        working-directory: backend
        env:
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          ARGS="--workers 4"
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          .venv/bin/python -m app.refresh $ARGS 2>&1 | tr '\r' '\n' | grep -v '^Fetching' || true
          # one retry pass for tickers that failed (usually rate limits)
          .venv/bin/python -m app.refresh --retry-errors --workers 2 2>&1 | tr '\r' '\n' | grep -v '^Fetching' || true
          tail -n 20 data/refresh.log || true

      - name: Save database
        if: always()
        uses: actions/cache/save@v6
        with:
          path: backend/data/screener.db
          key: screener-db-${{ github.run_id }}

      - name: Sanity check and export snapshot
        working-directory: backend
        env:
          MIN_ROWS: ${{ github.event.inputs.limit != '' && '1' || '3000' }}
        run: |
          .venv/bin/python - <<'PY'
          import os, sqlite3, sys
          c = sqlite3.connect("data/screener.db")
          n, ok = c.execute("SELECT COUNT(*), COALESCE(SUM(has_data), 0) FROM metrics").fetchone()
          print(f"metrics rows={n} with_data={ok}")
          if ok < int(os.environ["MIN_ROWS"]):
              sys.exit("Too little data fetched; not publishing (previous site stays up).")
          PY
          .venv/bin/python -m app.export --out ../frontend/public/data

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static site
        working-directory: frontend
        env:
          VITE_STATIC: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
