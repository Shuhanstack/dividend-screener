name: Weekly refresh & deploy

# Runs once a week, after Friday's US market close (Saturday 10:00 UTC),
# refreshes all US-listed common stocks from Yahoo Finance, and publishes the
# browser-only screener to GitHub Pages. Can also be started by hand.
on:
  schedule:
    - cron: "0 10 * * 6"
  workflow_dispatch:
    inputs:
      limit:
        description: "Only fetch the first N tickers (blank = full universe)"
        required: false
        default: ""

permissions:
  contents: write   # to save the database on the `data` branch
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -q -r requirements.txt

      # Last week's database lives on the `data` branch (permanent, unlike the
      # Actions cache). Any ticker that fails to fetch this week keeps that data.
      - name: Restore previous database
        run: scripts/data-branch.sh restore backend/data/screener.db

      # Time budgets leave room in the job limit (GitHub max is 6h), so a slow week still
      # publishes: fresh data where it arrived, last week's for the rest.
      # Fetch order is oldest-data-first, so next week starts where this one stopped.
      - name: Refresh data from Yahoo Finance
        working-directory: backend
        env:
          LIMIT: ${{ github.event.inputs.limit }}
        run: |
          ARGS="--workers 4 --time-budget-min 270"
          if [ -n "$LIMIT" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          .venv/bin/python -m app.refresh $ARGS 2>&1 | tr '\r' '\n' | grep -v '^Fetching' || true
          # one retry pass for tickers that failed (usually rate limits)
          .venv/bin/python -m app.refresh --retry-errors --workers 2 --time-budget-min 30 2>&1 | tr '\r' '\n' | grep -v '^Fetching' || true
          tail -n 20 data/refresh.log || true

      - name: Save database to data branch
        if: always()
        run: |
          if backend/.venv/bin/python -c "import sqlite3,sys; c=sqlite3.connect('backend/data/screener.db'); sys.exit(c.execute('PRAGMA integrity_check').fetchone()[0] != 'ok')"; then
            scripts/data-branch.sh save backend/data/screener.db
          else
            echo "::warning::Database failed integrity check; keeping the previous data branch."
          fi

      - name: Sanity check and export snapshot
        working-directory: backend
        env:
          MIN_ROWS: ${{ github.event.inputs.limit != '' && '1' || '3000' }}
        run: |
          .venv/bin/python - <<'PY'
          import os, sqlite3, sys
          c = sqlite3.connect("data/screener.db")
          n, ok = c.execute("SELECT COUNT(*), COALESCE(SUM(has_data), 0) FROM metrics").fetchone()
          stale = c.execute("SELECT COUNT(*) FROM metrics WHERE stale = '[\"all\"]'").fetchone()[0]
          print(f"metrics rows={n} with_data={ok} not_refreshed_this_run={stale}")
          if n and stale > n / 2:
              print(f"::warning::{stale} of {n} stocks were not refreshed this run and show previous data.")
          if ok < int(os.environ["MIN_ROWS"]):
              sys.exit("Too little data fetched; not publishing (previous site stays up).")
          PY
          .venv/bin/python -m app.export --out ../frontend/public/data

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build static site
        working-directory: frontend
        env:
          VITE_STATIC: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
